name: Build Multiplatform Releases (Linux & Windows)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_artifact: convert_imca-linux-x86_64
            cli_binary: convert_imca
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: convert_imca-windows-x86_64.exe
            cli_binary: convert_imca.exe

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libwebkit2gtk-4.0-37 gir1.2-webkit2-4.0 python3-gi python3-gi-cairo || sudo apt-get install -y libfuse2t64 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 python3-gi python3-gi-cairo || true

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar CLI em Rust (Release Otimizado)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências de Empacotamento GUI
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller Pillow pywebview

      # Build no Linux: Gera AppImage
      - name: Gerar Linux AppImage (.image / .AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh
          cp dist/Convert_IMCA-x86_64.AppImage dist/Convert_IMCA-linux-x86_64.AppImage
          cp target/${{ matrix.target }}/release/${{ matrix.cli_binary }} dist/${{ matrix.cli_artifact }}

      # Build no Windows: Gera .exe autônomo de janela
      - name: Gerar Windows Executável GUI (.exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name "Convert_IMCA_GUI-windows" `
            --icon "assets\icon.ico" `
            --add-data "assets;assets" `
            convert_imca_gui.py
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" -Destination "dist/${{ matrix.cli_artifact }}"

      - name: Upload de Artefatos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            dist/convert_imca-*
            dist/Convert_IMCA*

  create-release:
    name: Publicar GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download de Todos os Artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.6.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.6.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
