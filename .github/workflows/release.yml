name: Build Multiplatform Releases (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: convert_imca-linux-x86_64
            binary_name: convert_imca
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: convert_imca-windows-x86_64.exe
            binary_name: convert_imca.exe

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compilar Binário Release Otimizado
        run: cargo build --release --target ${{ matrix.target }}

      - name: Renomear Binário para Distribuição
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}
            chmod +x dist/${{ matrix.artifact_name }}
          fi

      - name: Upload de Artefato de Compilação
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
